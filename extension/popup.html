<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 260px;
        margin: 0;
        padding: 12px;
        color: #eee;
        background: #1a1a1a;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 8px;
        color: #aaa;
      }
      #total {
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 12px;
        font-variant-numeric: tabular-nums;
      }
      button {
        width: 100%;
        padding: 8px;
        font-size: 13px;
        border: 0;
        border-radius: 6px;
        background: #cc0000;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        background: #555;
        cursor: default;
      }
      #status {
        font-size: 11px;
        color: #999;
        min-height: 14px;
        margin: 6px 0 10px;
      }
      details {
        border-top: 1px solid #333;
        padding-top: 8px;
      }
      summary {
        font-size: 12px;
        color: #aaa;
        cursor: pointer;
      }
      label {
        display: block;
        font-size: 11px;
        color: #999;
        margin: 8px 0 2px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 5px;
        font-size: 12px;
        border: 1px solid #444;
        border-radius: 4px;
        background: #222;
        color: #eee;
      }
      #save {
        margin-top: 10px;
        background: #333;
      }
      #cfgStatus {
        font-size: 11px;
        color: #999;
        min-height: 14px;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <h1>YouTube today</h1>
    <div id="total">–</div>
    <button id="report">Report now</button>
    <div id="status"></div>

    <details id="opts">
      <summary>Options</summary>
      <label for="url">Worker URL</label>
      <input id="url" type="text" placeholder="https://ytber-worker.<you>.workers.dev" />
      <label for="secret">Ingest secret</label>
      <input id="secret" type="password" placeholder="X-Ingest-Secret value" />
      <button id="save">Save</button>
      <div id="cfgStatus"></div>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
